name: Build SkyrimCars

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/SkyrimCars/SKSE/Plugins | Out-Null
          Copy-Item build/Release/SkyrimCars.dll dist/SkyrimCars/SKSE/Plugins/SkyrimCars.dll
          Compress-Archive -Path dist/SkyrimCars -DestinationPath dist/SkyrimCars-v1.0.0-test.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimCars-v1.0.0-test
          path: dist/SkyrimCars-v1.0.0-test.zip

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-test.${{ github.run_number }}
          name: SkyrimCars v1.0.0-test.${{ github.run_number }}
          prerelease: true
          files: dist/SkyrimCars-v1.0.0-test.zip

name: Build SkyrimCars

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path src,CMakeLists.txt,vcpkg.json,vcpkg-configuration.json,README.md,docs,.github -DestinationPath dist/SkyrimCars-source.zip -Force

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimCars-source
          path: dist/SkyrimCars-source.zip
